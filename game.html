<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade Verde</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/board.css">
</head>
<body>
<div class="game-container">
    <div class="top-bar">
        <span id="playerName"></span>
        <span id="turno"></span>
    </div>

    <div id="board">

    </div>

    <div class="action">
        <button id="rollDice">Rolar Dado</button>
        <p id="diceResult"></p>
    </div>
    
    <div class="score">
        <p>Sustentabilidade> <span id="eco"></span></p>
        <p>Economia> <span id="money"></span></p>
        <p>Popularidade> <span id="pop"></span></p>
    </div>

</div>

<script type="module" src="./src/main.js"></script>

</body>
</html>
